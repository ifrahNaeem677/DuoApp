name: Build APK V2

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check uploaded files
        run: |
          test -f pubspec.yaml || { echo "pubspec.yaml is missing - upload it to the repo"; exit 1; }
          test -f tool/patch_android.py || { echo "tool/patch_android.py is missing - upload the tool folder"; exit 1; }

      - name: Create Flutter project files
        run: |
          flutter create --project-name duodeen --org com.duodeen --platforms android .
          rm -f test/widget_test.dart

      - name: Patch Android settings
        run: python3 tool/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: DuoDeen-APK
          path: build/app/outputs/flutter-apk/app-release.apk
